<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="128x128" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kumo — Read Japanese anywhere. Learn as you go. A Chrome extension that adds furigana, definitions, and a word bank to any Japanese text on the web." />
    <title>Kumo — Read Japanese Anywhere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <!-- Open Graph / Social -->
    <meta property="og:title" content="Kumo — Read Japanese Anywhere" />
    <meta property="og:description" content="A Chrome extension that adds furigana, definitions, and a word bank to any Japanese text on the web. Learn as you go." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/example_nge.png" />
    <meta property="og:url" content="https://kumo-app.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kumo — Read Japanese Anywhere" />
    <meta name="twitter:description" content="A Chrome extension that adds furigana, definitions, and a word bank to any Japanese text on the web." />
    <meta name="twitter:image" content="/example_nge.png" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3a6ff5" />
    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Kumo",
      "description": "Read Japanese anywhere. Learn as you go.",
      "url": "https://kumo-app.vercel.app",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Chrome",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Eric Wang"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
      }
    </script>
  </body>
</html>
