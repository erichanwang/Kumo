name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --config vitest.config.ts
      - run: npx tsc --noEmit
      - run: npm run build

  test-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx vitest run --config vitest.config.ts
      - run: npx tsc -b --noEmit
      - run: npm run build


